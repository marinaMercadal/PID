<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JuntApp — Nueva juntada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
</head>
<body>

<div class="pagina">
  <div class="marca">JuntApp</div>

  <div class="tarjeta-formulario tarjeta-ancha">
    <div class="encabezado-tarjeta">
      <h2>Nueva juntada</h2>
      <div class="encabezado-acciones">
        <a href="{{ url_for('mostrar_calendario') }}" class="boton-texto">Cancelar</a>
      </div>
    </div>

    {% if error %}
    <p class="mensaje-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('crear_juntada') }}">
      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" placeholder="¿Qué van a hacer?" required>
      </div>

      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" value="{{ fecha_sugerida }}" required>
      </div>

      <div class="fila-horarios">
        <div class="campo">
          <label for="hora_inicio">Desde</label>
          <input type="time" id="hora_inicio" name="hora_inicio" required>
        </div>
        <div class="campo">
          <label for="hora_fin">Hasta</label>
          <input type="time" id="hora_fin" name="hora_fin" required>
        </div>
      </div>

      <div class="seccion">
        <h3 class="titulo-seccion">Invitar amigos</h3>
        <ul class="lista">
          {% for amigo in amigos %}
          <li class="fila">
            <label class="fila-seleccionable">
              <input type="checkbox" name="invitados" value="{{ amigo.id }}">
              <span class="fila-info">
                <span class="fila-nombre">{{ amigo.nombre }}</span>
                <span class="fila-detalle">{{ amigo.email }}</span>
              </span>
            </label>
          </li>
          {% else %}
          <li class="fila fila-vacia">Todavía no tenés amigos para invitar</li>
          {% endfor %}
        </ul>
      </div>

      <button type="submit" class="boton-enviar">Crear juntada</button>
    </form>
  </div>
</div>

</body>
</html>
