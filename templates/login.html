<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JuntApp — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
</head>
<body>

<div class="pagina">
  <div class="marca">JuntApp</div>

  <div class="tarjeta-formulario">
    <h2>Iniciá sesión</h2>
    <p class="subtitulo">Entrá a tu cuenta para coordinar tus juntadas.</p>

    {% if request.args.get("baja") == "1" %}
    <p role="status">Tu cuenta fue dada de baja.</p>
    {% endif %}

    {% if error %}
    <p class="mensaje-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
      </div>

      <button type="submit" class="boton-enviar">Iniciar sesión</button>
    </form>

    <p class="aviso-login">¿No tenés cuenta? <a href="{{ url_for('mostrar_registro') }}">Creá una</a></p>
  </div>
</div>

</body>
</html>
