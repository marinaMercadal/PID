<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JuntApp — Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">



</head>
<body>

<div class="pagina">
  <div class="marca">JuntApp</div>

  <div class="tira-semana" aria-hidden="true">
    <div class="columna-dia"><span class="punto salvia"></span></div>
    <div class="columna-dia"><span class="punto vacio"></span></div>
    <div class="columna-dia"><span class="punto mostaza"></span></div>
    <div class="columna-dia"><span class="punto coral"></span></div>
    <div class="columna-dia"><span class="punto salvia"></span></div>
    <div class="columna-dia"><span class="punto salvia"></span></div>
    <div class="columna-dia"><span class="punto vacio"></span></div>
  </div>

  <div class="tarjeta-formulario">
    <h2>Creá tu cuenta</h2>
    <p class="subtitulo">Un minuto y ya podés empezar a coordinar juntadas.</p>

    <form id="form-registro" method="POST" action="/registro">
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Cómo te van a ver tus amigos" required>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Elegí una contraseña" required>
        <p class="requisitos-password">Debe tener al menos 8 caracteres, una mayúscula y un símbolo.</p>
      </div>

      <button type="submit" class="boton-enviar">Crear cuenta</button>

    
    </form>

    <p class="aviso-login">¿Ya tenés cuenta? <a href="#">Iniciá sesión</a></p>
  </div>
</div>

</body>
</html>
